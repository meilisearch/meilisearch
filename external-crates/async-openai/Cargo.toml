[package]
name = "async-openai"
version = "0.28.1"
authors = ["Himanshu Neema"]
categories = ["api-bindings", "web-programming", "asynchronous"]
keywords = ["openai", "async", "openapi", "ai"]
description = "Rust library for OpenAI"
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/64bit/async-openai"
repository = "https://github.com/64bit/async-openai"

[features]
default = []
realtime = ["dep:tokio-tungstenite"]
# Bring your own types
byot = []

[dependencies]
async-openai-macros = { path = "../async-openai-macros", version = "0.1.0" }
backoff = { version = "0.4.0", features = ["tokio"] }
base64 = "0.22.1"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
rand = "0.8.7"
http-client = { path = "../../crates/http-client" }
routes = { path = "../../crates/routes" }
reqwest-eventsource = { version = "0.6.0", path = "../reqwest-eventsource" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "macros"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["codec", "io-util"] }
tracing = "0.1.44"
derive_builder = "0.20.2"
utoipa = { version = "5.5.0", features = ["preserve_order"] }
secrecy = { version = "0.10.3", features = ["serde"] }
bytes = "1.12.1"
eventsource-stream = "0.2.3"
tokio-tungstenite = { version = "0.26.2", optional = true, default-features = false }

[dev-dependencies]
tokio-test = "0.4.5"
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
