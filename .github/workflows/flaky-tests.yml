name: Look for flaky tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # Every day at 4:00AM

jobs:
  flaky:
    # Use ubuntu-22.04 to compile with glibc 2.35
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clean space as per https://github.com/actions/virtual-environments/issues/709
        run: |
          sudo rm -rf "/opt/ghc" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
      - name: Make sure cargo is installed
        run: cargo --version
      - name: Install cargo-flaky
        run: cargo install cargo-flaky
      - name: Run cargo flaky in the dumps
        run: cd crates/dump; cargo flaky -i 60 --release
      - name: Run cargo flaky in the index-scheduler
        run: cd crates/index-scheduler; cargo flaky -i 60 --release
      - name: Run cargo flaky in the auth
        run: cd crates/meilisearch-auth; cargo flaky -i 60 --release
      - name: Run cargo flaky in meilisearch
        run: cd crates/meilisearch; cargo flaky -i 60 --release
